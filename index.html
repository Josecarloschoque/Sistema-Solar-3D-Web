<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sistema Solar 3D · Web</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#010208;color:#fff;font-family:Inter,Segoe UI,Arial,sans-serif}#app{position:fixed;inset:0}canvas{display:block}
.panel{position:fixed;top:18px;left:18px;z-index:5;background:rgba(3,7,18,.70);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.13);border-radius:16px;padding:16px 18px;max-width:330px;box-shadow:0 16px 50px rgba(0,0,0,.35)}
h1{font-size:20px;margin:0 0 6px}.sub{font-size:12px;color:#aab4cc;line-height:1.4}.controls{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:7px}button{border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.08);color:white;border-radius:9px;padding:8px;cursor:pointer}button:hover{background:rgba(255,255,255,.16)}
.badge{position:fixed;right:16px;bottom:14px;color:#98a6c4;font-size:11px;background:rgba(3,7,18,.55);padding:8px 10px;border-radius:10px}.planetbar{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);display:flex;gap:5px;z-index:5;background:rgba(3,7,18,.65);padding:8px;border-radius:13px;border:1px solid rgba(255,255,255,.12);backdrop-filter:blur(10px)}.planetbar button{font-size:11px;padding:7px 9px}@media(max-width:760px){.panel{max-width:250px}.planetbar{max-width:92vw;overflow:auto;justify-content:flex-start}}
</style>
</head><body><div id="app"></div>
<div class="panel"><h1>☀ Sistema Solar 3D</h1><div class="sub">Versión web del proyecto de Computación Gráfica. Arrastra para rotar · rueda para zoom · selecciona un planeta para seguirlo.</div><div class="controls"><button id="pause">⏸ Pausar</button><button id="orbits">◉ Órbitas</button><button id="asteroids">✦ Asteroides</button><button id="reset">⌂ Vista general</button></div></div>
<div class="planetbar" id="planetbar"></div><div class="badge">WebGL · renderizado por la GPU del visitante</div>
<script type="module" src="./app.js"></script></body></html>
